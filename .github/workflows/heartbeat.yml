name: Heartbeat

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend healthz
        run: curl -fsS --max-time 120 --retry 5 --retry-delay 15 --retry-connrefused --retry-all-errors "${{ vars.RENDER_SERVICE_URL }}/healthz"
